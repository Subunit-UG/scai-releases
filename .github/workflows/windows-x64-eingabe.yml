# SCAI — temporaerer Windows-x64-Quellpruefer fuer den geschuetzten Eingabeweg (Auftrag 11).
# Zwilling von windows-arm-smoke.yml; laeuft nur per Push auf diesen Pruef-Branch,
# erzeugt kein Release und keine Updater-Metadaten. Branch wird nach der Pruefung entfernt.

name: Windows x64 Eingabe-Pruefung

on:
  push:
    branches: ['ci/windows-x64-eingabe']

env:
  SRC_REF_PIN: "9e49fa9dc0c1d7b7f71276a063611d31b800408c"
  DIAG_KEY: ""

permissions:
  contents: read

concurrency:
  group: windows-x64-eingabe
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows x64 Eingabe-Pruefung
    runs-on: windows-2025
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      # Wie in build-all.yml/pr-check.yml: Git Bash statt actions/checkout mit
      # SSH-Key, weil der windows-11-arm-Runner kein verlässliches System-OpenSSH
      # bereitstellt. Der private Key bleibt ausschließlich im Step-Prozess.
      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ env.SRC_REF_PIN }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"

          # Fetch by ref into an empty repository so branch, tag, and commit SHA
          # inputs all use the same path. No source ref is interpolated into a
          # shell expression; it remains one quoted git argument.
          git init src
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SRC_REF"
          git -C src checkout --detach FETCH_HEAD
          echo "ausgecheckt: $SRC_REF → $(git -C src rev-parse --short HEAD)"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Rust einrichten (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Abhängigkeiten installieren
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" x64-npm-ci npm ci

      - name: Frontend bauen (tsc + vite)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" x64-frontend-build npm run build


      # Der Trace-Kern zieht libsqlite3-sys mit SQLCipher herein; dessen build.rs
      # bricht ohne OPENSSL_DIR ab. build-all.yml stellt OpenSSL je Ziel über
      # vcpkg bereit — ohne denselben Schritt prüft der Smoke eine andere Welt
      # als die Release-Schiene und meldet Fehler, die es dort nicht gibt.
      - name: OpenSSL für Trace-SQLCipher (x64)
        shell: pwsh
        env:
          OPENSSL_TRIPLET: x64-windows-static-md
        run: |
          vcpkg install "openssl:$env:OPENSSL_TRIPLET"
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$env:OPENSSL_TRIPLET" >> $env:GITHUB_ENV

      - name: Privaten Trace-Kern für Cargo freischalten (read-only)
        shell: bash
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRACE_DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Rust x64 prüfen (locked)
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ env.DIAG_KEY }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ env.DIAG_KEY != '' && format('{0}/scai-x64-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" x64-cargo-check cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked --features local-meet

      - name: Geschuetzte Eingabe testen (Win32, unsichtbar)
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ env.DIAG_KEY }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ format('{0}/scai-x64-diagnostic.json', runner.temp) }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" x64-secret-entry-test cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked --features local-meet --lib secret_entry -- --test-threads=1

      - name: Private Trace-Credentials entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true

      - name: Verschlüsselte x64-Fehlerdiagnostik bereitstellen
        if: failure() && env.DIAG_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-windows-x64-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-x64-diagnostic.json
          if-no-files-found: error
          retention-days: 1
