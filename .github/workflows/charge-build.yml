name: Subunit Charge Signed Build (private source)

# Baut und signiert Subunit Charge (App + root-Hilfsdienst) aus einem exakt
# gepinnten Commit von Subunit-UG/subunit-charge. Muster: notch-build.yml.
# Zwei Jobs auf getrennten Runnern:
#   build  Quellzugang nur lesend über die GitHub-App CHARGE_READ (genau dieses
#          Repo); der Token wird vor dem Bau widerrufen. Baut ohne
#          Signier-Identität und kennt keine Signier-Geheimnisse. Übergibt das
#          Bundle als Umschlag, den nur der Signier-Job öffnen kann.
#   sign   führt keinen Baucode aus und sieht keinen Quelltext. Öffnet den
#          Umschlag, signiert jedes Teil des Bundles neu und prüft die Signatur.
# Ausgabe nur im verschlüsselten Umschlag.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Vollstaendiger subunit-charge-Commit-SHA"
        required: true
        type: string
      version:
        description: "Erwartete CFBundleShortVersionString (z. B. 1.0.0)"
        required: true
        type: string
      recipient_public_key_base64:
        description: "Einmal-RSA-Public-Key (PEM, base64, >= 3072 Bit) fuer den verschluesselten Umschlag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: charge-build-${{ inputs.source_sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  EXPECTED_VERSION: ${{ inputs.version }}
  RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
  EXPECTED_TEAM: Y23NYAZM6M
  APP_IDENTIFIER: co.subunit.charge
  HELPER_IDENTIFIER: co.subunit.charge.helper

jobs:
  build:
    name: Subunit Charge bauen (ohne Signier-Identitaet)
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      handover_sha256: ${{ steps.handover.outputs.sha256 }}
    steps:
      - name: Oeffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Commit-Pin, Version und Schluessel pruefen
        shell: bash
        run: |
          set -euo pipefail
          bash gate/scripts/check-signed-build-request.sh charge

      - name: Lesetoken fuer genau subunit-charge holen
        id: charge-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2, immutable
        with:
          app-id: ${{ vars.CHARGE_READ_APP_ID }}
          private-key: ${{ secrets.CHARGE_READ_APP_PRIVATE_KEY }}
          owner: Subunit-UG
          repositories: subunit-charge
          permission-contents: read

      - name: Subunit Charge exakt und read-only auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          repository: Subunit-UG/subunit-charge
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.charge-app.outputs.token }}
          path: private/subunit-charge
          persist-credentials: false
          fetch-depth: 1

      - name: Lesetoken vor jedem privaten Code widerrufen
        if: always() && steps.charge-app.outputs.token != ''
        env:
          CHARGE_TOKEN: ${{ steps.charge-app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          # Kopfzeile ueber stdin (printf ist eingebaut): der Token steht nie in einer Kommandozeile.
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$CHARGE_TOKEN" \
            | curl -sS -o /dev/null -w '%{http_code}' -K - -X DELETE \
                -H 'Accept: application/vnd.github+json' https://api.github.com/installation/token)
          [ "$code" = "204" ] || { echo "::error::Token-Widerruf fehlgeschlagen ($code)"; exit 1; }
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$CHARGE_TOKEN" \
            | curl -sS -o /dev/null -w '%{http_code}' -K - https://api.github.com/installation/repositories)
          [ "$code" = "401" ] || { echo "::error::Token nach Widerruf noch gueltig ($code)"; exit 1; }
          echo "PASS charge-token-revoked"

      - name: Quellstand pruefen
        working-directory: private/subunit-charge
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "::error::Ausgecheckter Stand passt nicht zum Pin"; exit 1; }
          if git config --get-regexp '^http\..*extraheader' >/dev/null; then echo "::error::Zugangsdaten im Checkout"; exit 1; fi
          [ "$(tr -d '[:space:]' < VERSION)" = "$EXPECTED_VERSION" ] || { echo "::error::VERSION passt nicht"; exit 1; }
          echo "PASS charge-source (head=$SOURCE_SHA)"

      - name: Bundle bauen (ohne Signier-Identitaet)
        id: charge_build
        working-directory: private/subunit-charge
        env:
          # Fehlerausgabe nur verschluesselt an den Einmal-Schluessel (Muster u1-chat-pr-check).
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ runner.temp }}/charge-build-diagnostic.json
        shell: bash
        run: |
          set -euo pipefail
          CHARGE_SIGN_ID=- \
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" charge-build ./build.sh release
          test -d "dist/Subunit Charge.app"

      - name: Verschluesselte Bau-Diagnose hochladen
        if: failure() && steps.charge_build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: subunit-charge-encrypted-diagnostic-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/charge-build-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Bundle pruefen und fuer den Signier-Job verschluesseln
        id: handover
        working-directory: private/subunit-charge
        shell: bash
        run: |
          set -euo pipefail
          app="dist/Subunit Charge.app"
          plist="$app/Contents/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          [ "$version" = "$EXPECTED_VERSION" ] || { echo "::error::Bundle-Version passt nicht zur erwarteten Version."; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$APP_IDENTIFIER" ] || { echo "::error::Bundle-ID"; exit 1; }
          bash "$GITHUB_WORKSPACE/gate/scripts/seal-build-handover.sh" "$app" "$RUNNER_TEMP/charge-handover"
          echo "PASS charge-handover (version=$EXPECTED_VERSION, plaintext nur im Umschlag)"

      - name: Umschlag an den Signier-Job uebergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: subunit-charge-handover-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/charge-handover/
          retention-days: 1
          if-no-files-found: error

      - name: Arbeitsordner leeren
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private" "$RUNNER_TEMP/charge-handover"

  sign:
    name: Subunit Charge signieren
    needs: build
    environment: release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Oeffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Commit-Pin, Version und Schluessel pruefen
        shell: bash
        run: |
          set -euo pipefail
          bash gate/scripts/check-signed-build-request.sh charge

      - name: Umschlag des Bau-Jobs holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, immutable
        with:
          name: subunit-charge-handover-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/handover

      - name: Umschlag pruefen und oeffnen
        env:
          RELEASE_HANDOVER_PRIVATE_KEY: ${{ secrets.RELEASE_HANDOVER_PRIVATE_KEY }}
          HANDOVER_SHA256: ${{ needs.build.outputs.handover_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          bash gate/scripts/open-build-handover.sh "$RUNNER_TEMP/handover" "$RUNNER_TEMP/charge-work"

      # Ohne Geheimnisse: Der Inhalt des Umschlags ist Eingabe aus dem Bau-Job.
      - name: Bundle auspacken und pruefen
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/charge-work"
          python3 -I gate/scripts/extract-app-bundle.py "$work/unsigned.zip" "$work/app" "Subunit Charge.app"
          rm -f "$work/unsigned.zip"
          app="$work/app/Subunit Charge.app"
          [ -z "$(find "$work/app" -type l -print -quit)" ] || { echo "::error::Bundle enthaelt symbolische Verweise."; exit 1; }
          plist="$app/Contents/Info.plist"
          daemon="$app/Contents/Library/LaunchDaemons/co.subunit.charge.helper.plist"
          helper="$app/Contents/MacOS/SubunitChargeHelper"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          [ "$version" = "$EXPECTED_VERSION" ] || { echo "::error::Bundle-Version passt nicht zur erwarteten Version."; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$APP_IDENTIFIER" ] || { echo "::error::Bundle-ID"; exit 1; }
          [ -f "$helper" ] && [ ! -L "$helper" ] || { echo "::error::Hilfsdienst fehlt im Bundle."; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$daemon")" = "Contents/MacOS/SubunitChargeHelper" ] || { echo "::error::BundleProgram"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c "Print :MachServices:$HELPER_IDENTIFIER" "$daemon")" = "true" ] || { echo "::error::MachServices"; exit 1; }
          echo "CHARGE_APP=$app" >> "$GITHUB_ENV"
          echo "PASS charge-bundle-checked (version=$EXPECTED_VERSION)"

      - name: Signier-Identitaet in temporaeren Schluesselbund laden
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_ENV: CHARGE_KEYCHAIN
        shell: bash
        run: |
          set -euo pipefail
          set +x
          case "${APPLE_SIGNING_IDENTITY:-}" in
            "Developer ID Application:"*|"Apple Development:"*) ;;
            *) echo "::error::Signier-Identitaet fehlt oder ist unerwartet — kein ad-hoc Charge-Release."; exit 1 ;;
          esac
          bash gate/scripts/load-signing-identity.sh

      - name: Bundle neu signieren
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          # Sichere Zeitstempel traegt nur eine Developer-ID-Signatur.
          timestamp=none
          case "$APPLE_SIGNING_IDENTITY" in "Developer ID Application:"*) timestamp=secure ;; esac
          echo "CHARGE_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          # Was signiert wird, mit welcher Kennung und welchen Rechten, steht allein in der Liste dieses Repos.
          python3 -I gate/scripts/resign-app-bundle.py "$CHARGE_APP" --manifest gate/config/signing/charge.json \
            --expect-team "$EXPECTED_TEAM" --timestamp "$timestamp"
          # Die Identitaet wird nach dem Signieren nicht mehr gebraucht.
          security delete-keychain "$CHARGE_KEYCHAIN"
          echo "CHARGE_KEYCHAIN=" >> "$GITHUB_ENV"
          echo "PASS charge-resigned"

      - name: Signatur pruefen
        shell: bash
        run: |
          set -euo pipefail
          # Ohne Identitaet: App und Hilfsdienst tragen ihre Kennung, dieses Team und Hardened Runtime, keine Rechte.
          python3 -I gate/scripts/resign-app-bundle.py "$CHARGE_APP" --manifest gate/config/signing/charge.json --verify-only \
            --expect-team "$EXPECTED_TEAM" --timestamp "$CHARGE_TIMESTAMP"
          echo "PASS charge-signature (version=$EXPECTED_VERSION team=$EXPECTED_TEAM)"

      - name: Archiv verschluesseln
        shell: bash
        run: |
          set -euo pipefail
          plain="$RUNNER_TEMP/charge-plain"
          out="$RUNNER_TEMP/charge-out"
          mkdir -p "$plain" "$out"
          archive="$plain/SubunitCharge-$EXPECTED_VERSION.zip"
          ditto -c -k --keepParent "$CHARGE_APP" "$archive"
          envelope="$out/SubunitCharge-$EXPECTED_VERSION.zip.envelope.json"
          node gate/scripts/encrypt-confidential-log.mjs "$archive" "$envelope" "$RECIPIENT_PUBLIC_KEY_BASE64" > /dev/null
          rm -rf "$plain"
          printf '{"source_sha":"%s","version":"%s"}\n' "$SOURCE_SHA" "$EXPECTED_VERSION" > "$out/build-receipt.json"
          # Der Empfaenger gleicht diesen Digest mit der geladenen Datei ab.
          echo "PASS charge-envelope (sha256=$(shasum -a 256 "$envelope" | cut -d ' ' -f 1), plaintext nur im Umschlag)"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: subunit-charge-${{ inputs.version }}
          path: ${{ runner.temp }}/charge-out/
          retention-days: 7
          if-no-files-found: error

      - name: Temporaeren Schluesselbund und Arbeitsordner entfernen
        if: always()
        shell: bash
        run: |
          if [ -n "${CHARGE_KEYCHAIN:-}" ]; then security delete-keychain "$CHARGE_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/handover" "$RUNNER_TEMP/charge-work" "$RUNNER_TEMP/charge-plain"
