# One-off maintenance: move signing/publishing secrets into the protected
# `release` environment, and probe the environment afterwards.
#
# - Runs only on `main` via workflow_dispatch; the `release` environment itself
#   only admits `main`, so a dispatch on any other branch or tag is rejected
#   before a runner receives secrets.
# - `copy` reads each value inside the environment job (environment secrets win,
#   otherwise the repository secret of the same name is used) and writes it to
#   the environment via stdin. Values never appear in arguments or logs.
# - `probe` reports only "present"/"missing" per name, never values or lengths.
# - Shares the release mutation lock, so it never overlaps a release run.
# This file is removed again once the migration is verified.

name: Release environment secrets (one-off)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (read-only) or copy (requires confirmation)"
        type: choice
        options:
          - probe
          - copy
        default: probe
      confirmation:
        description: "For copy: exactly COPY_SIGNING_SECRETS_TO_RELEASE"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scai-release-mutation
  cancel-in-progress: false

jobs:
  copy:
    if: inputs.mode == 'copy'
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Copy secrets into the release environment
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.RELEASE_ENV_MIGRATION_TOKEN }}
          REPO: ${{ github.repository }}
          V_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          V_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          V_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          V_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          V_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SUBUNIT_APP_PRIVATE_KEY: ${{ secrets.SUBUNIT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$CONFIRMATION" != "COPY_SIGNING_SECRETS_TO_RELEASE" ]; then
            echo "::error::Confirmation missing."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Migration token missing."
            exit 1
          fi
          names=(
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            SONAR_TAURI_SIGNING_PRIVATE_KEY SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            SUBUNIT_APP_PRIVATE_KEY
          )
          # Base64/PEM key material: a trailing line break carries no meaning.
          # Everything else (passwords, identities) must arrive byte-exact.
          key_material=" APPLE_CERTIFICATE TAURI_SIGNING_PRIVATE_KEY SONAR_TAURI_SIGNING_PRIVATE_KEY SUBUNIT_APP_PRIVATE_KEY "
          # Keep the values as shell variables only; no external process inherits them.
          for name in "${names[@]}"; do export -n "V_$name"; done
          # Validate everything before the first write: gh secret set strips
          # trailing CR/LF, so such values would not be copied byte-exact.
          for name in "${names[@]}"; do
            var="V_$name"
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$name has no value; nothing copied."
              exit 1
            fi
            case "$value" in
              *$'\n'|*$'\r')
                if [[ "$key_material" != *" $name "* ]]; then
                  echo "::error::$name ends with a line break and would not be copied byte-exact; nothing copied."
                  exit 1
                fi
                echo "note: $name is key material; its trailing line break is not significant."
                ;;
            esac
          done
          for name in "${names[@]}"; do
            var="V_$name"
            printf '%s' "${!var}" | gh secret set "$name" --env release --repo "$REPO" > /dev/null
            echo "copied: $name"
          done

      - name: List environment secret names (no values in this step)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ENV_MIGRATION_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/environments/release/secrets" --jq '[.secrets[].name] | sort | join(" ")'

  probe:
    if: inputs.mode == 'probe'
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Report presence per name (never values)
        shell: bash
        env:
          V_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          V_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          V_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          V_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          V_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SUBUNIT_APP_PRIVATE_KEY: ${{ secrets.SUBUNIT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
              SONAR_TAURI_SIGNING_PRIVATE_KEY SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
              SUBUNIT_APP_PRIVATE_KEY; do
            var="V_$name"
            if [ -n "${!var}" ]; then echo "present: $name"; else echo "missing: $name"; missing=1; fi
          done
          exit "$missing"
