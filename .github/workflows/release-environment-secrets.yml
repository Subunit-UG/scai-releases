# One-off maintenance: move signing/publishing secrets into the protected
# `release` environment, and compare the environment afterwards.
#
# - Runs only on `main` via workflow_dispatch; the `release` environment itself
#   only admits `main`, so a dispatch on any other branch or tag is rejected
#   before a runner receives secrets.
# - `seal` reads each value inside the environment job (environment secrets win,
#   otherwise the repository secret of the same name is used) and seals it for
#   the public key of the `release` environment. Only the secrets API can open a
#   sealed value; it is stored there as `encrypted_value`. The sealed values
#   leave the runner encrypted to a one-time recipient key, the digests of the
#   values encrypted to the handover key of the environment. Every digest is
#   salted per run and keyed with the value of the first name.
# - `compare` accepts only a completed seal run of this workflow on `main`,
#   opens its digests and reports per name whether the value the environment
#   job sees now has the same digest.
# - No step prints a value, a length or a digest; output is names and one word.
# - Shares the release mutation lock, so it never overlaps a release run.
# This file is removed again once the migration is verified.

name: Release environment secrets (one-off)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "seal (requires confirmation and a recipient key) or compare (requires the seal run)"
        type: choice
        options:
          - compare
          - seal
        default: compare
      confirmation:
        description: "For seal: exactly SEAL_SIGNING_SECRETS_FOR_RELEASE"
        required: false
        default: ""
      recipient_public_key_base64:
        description: "For seal: one-time RSA public key with at least 3072 bits (PEM, base64)"
        required: false
        default: ""
      seal_run_id:
        description: "For compare: id of the seal run whose digests are compared"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scai-release-mutation
  cancel-in-progress: false

env:
  # Public key of the `release` environment (GET .../environments/release/secrets/public-key).
  ENVIRONMENT_PUBLIC_KEY: "vC6id5DC1Rao0QXsmiQYnWeKm/zXAvVDfC2bfHO7GyQ="
  ENVIRONMENT_KEY_ID: "3380204578043523366"
  NAMES: >-
    APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
    APPLE_DEVID_CERTIFICATE APPLE_DEVID_CERTIFICATE_PASSWORD APPLE_DEVID_SIGNING_IDENTITY
    APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID
    TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
    SONAR_TAURI_SIGNING_PRIVATE_KEY SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD
    SUBUNIT_APP_PRIVATE_KEY

jobs:
  seal:
    if: inputs.mode == 'seal'
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          persist-credentials: false

      - name: Seal the values for the release environment
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
          V_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          V_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          V_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          V_APPLE_DEVID_CERTIFICATE: ${{ secrets.APPLE_DEVID_CERTIFICATE }}
          V_APPLE_DEVID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVID_CERTIFICATE_PASSWORD }}
          V_APPLE_DEVID_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVID_SIGNING_IDENTITY }}
          V_APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          V_APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          V_APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          V_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          V_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SUBUNIT_APP_PRIVATE_KEY: ${{ secrets.SUBUNIT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$CONFIRMATION" != "SEAL_SIGNING_SECRETS_FOR_RELEASE" ]; then
            echo "::error::Confirmation missing."
            exit 1
          fi
          if [ -z "$RECIPIENT_PUBLIC_KEY_BASE64" ]; then
            echo "::error::Recipient key missing."
            exit 1
          fi
          work="$RUNNER_TEMP/seal-work"
          out="$RUNNER_TEMP/seal-out"
          mkdir -p "$work" "$out"
          trap 'rm -rf "$work"' EXIT
          node scripts/seal-environment-secrets.mjs selftest
          read -r -a names <<<"$NAMES"
          node scripts/seal-environment-secrets.mjs seal "$work/sealed.json" "$work/digests.json" \
            "$ENVIRONMENT_PUBLIC_KEY" "$ENVIRONMENT_KEY_ID" "${names[@]}"
          node scripts/encrypt-confidential-log.mjs "$work/sealed.json" "$out/sealed.envelope.json" "$RECIPIENT_PUBLIC_KEY_BASE64" > /dev/null
          node scripts/encrypt-confidential-log.mjs "$work/digests.json" "$out/digests.envelope.json" \
            "$(tr -d '[:space:]' < config/release-handover-public-key.b64)" > /dev/null
          echo "PASS release-environment-seal (names=${#names[@]})"

      - name: Upload the envelopes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: release-environment-seal
          path: ${{ runner.temp }}/seal-out
          if-no-files-found: error
          retention-days: 1

  compare:
    if: inputs.mode == 'compare'
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          persist-credentials: false

      - name: Check the run id
        shell: bash
        env:
          SEAL_RUN_ID: ${{ inputs.seal_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if ! [[ "$SEAL_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::Seal run id missing."
            exit 1
          fi

      - name: Check the origin of the seal run
        shell: bash
        env:
          SEAL_RUN_ID: ${{ inputs.seal_run_id }}
          RUN_LOOKUP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(printf 'header = "Authorization: Bearer %s"\n' "$RUN_LOOKUP_TOKEN" \
            | curl -fsS -K - -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SEAL_RUN_ID") || run="{}"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/release-environment-secrets.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .status == "completed"
            and .conclusion == "success"
            and .repository.full_name == $repo
            and .head_repository.full_name == $repo
          ' <<<"$run" > /dev/null || {
            echo "::error::The seal run is not a completed run of this workflow on main."
            exit 1
          }

      - name: Download the envelopes of the seal run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, immutable
        with:
          name: release-environment-seal
          path: ${{ runner.temp }}/seal-in
          run-id: ${{ inputs.seal_run_id }}
          github-token: ${{ github.token }}

      - name: Compare the digests per name (never values)
        shell: bash
        env:
          RELEASE_HANDOVER_PRIVATE_KEY: ${{ secrets.RELEASE_HANDOVER_PRIVATE_KEY }}
          V_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          V_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          V_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          V_APPLE_DEVID_CERTIFICATE: ${{ secrets.APPLE_DEVID_CERTIFICATE }}
          V_APPLE_DEVID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVID_CERTIFICATE_PASSWORD }}
          V_APPLE_DEVID_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVID_SIGNING_IDENTITY }}
          V_APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          V_APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          V_APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          V_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          V_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY }}
          V_SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V_SUBUNIT_APP_PRIVATE_KEY: ${{ secrets.SUBUNIT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/compare-work"
          mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$RELEASE_HANDOVER_PRIVATE_KEY" > "$work/handover.pem"
          export -n RELEASE_HANDOVER_PRIVATE_KEY
          node scripts/decrypt-confidential-envelope.mjs "$RUNNER_TEMP/seal-in/digests.envelope.json" "$work/digests.json" "$work/handover.pem" > /dev/null 2>&1 || {
            echo "::error::The digests of the seal run cannot be opened."
            exit 1
          }
          rm -f "$work/handover.pem"
          read -r -a names <<<"$NAMES"
          node scripts/seal-environment-secrets.mjs compare "$work/digests.json" "${names[@]}"
          echo "PASS release-environment-compare (names=${#names[@]})"
