# Echo — SHA-gebundener PR-Check fuer das PRIVATE Quell-Repo.
#
# Das private Echo-Repo kann wegen der Org-Billing-Sperre derzeit keine Jobs
# starten. Dieser ausschliesslich manuell ausloesbare Public-Runner checkt genau
# einen vollstaendigen Commit-SHA mit einem read-only Deploy-Key aus. Private
# Befehlsausgaben bleiben in fluechtigen Dateien und werden nie veroeffentlicht.

name: Echo PR Check (private source)
run-name: "Echo PR Check ${{ inputs.source_sha }}"   # u1-gate findet den Lauf zum exakten Head (Mauer 29.10.)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Vollstaendiger Echo-Commit-SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: echo-pr-check-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Echo server contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Oeffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Commit-Pin pruefen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "PASS echo-source-pin (source-sha=$SOURCE_SHA)"

      - name: Gepinntes Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable
        with:
          python-version: "3.10"

      - name: Echo exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.ECHO_SOURCE_DEPLOY_KEY }}
        run: bash gate/scripts/checkout-private-source.sh echo git@github.com:subunit-ai/echo.git "$SOURCE_SHA"

      - name: Testabhaengigkeiten installieren
        working-directory: private/echo
        # Keep the fallback runner aligned with the private server-contracts
        # workflow: JWT/HTTP/API tests must run, not fail on missing imports.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-install \
            python -m pip install -c server/runtime-security-constraints.txt \
            "numpy==1.26.4" "cryptography==50.0.2" "pyOpenSSL==26.4.0" \
            "fastapi==0.136.3" "pydantic[email]==2.13.4" "httpx==0.28.1" \
            "python-multipart==0.0.29" "PyJWT==2.13.0" "requests==2.33.0" \
            "soundfile==0.14.0" "anyio==4.14.2" "starlette==1.3.1" \
            "typing_extensions==4.16.0"

      - name: Python-Syntax und vollstaendige Server-Suite
        working-directory: private/echo
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-compile python -m compileall -q server
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-tests python -m unittest discover -s server/tests -p 'test_*.py' -v

      - name: Bekannte rote Latenz-Baseline muss STOP_SHIP bleiben
        working-directory: private/echo
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-latency-stop-ship \
            python -m unittest server.tests.test_meeting_release_gate.MeetingReleaseGateTests.test_known_30_minute_aggregate_is_stop_ship_and_incomplete

      - name: Runtime-, Watcher- und Deployment-Vertraege
        working-directory: private/echo
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-runtime-contracts bash -c '
            grep -Eq "^COPY .*meeting_queue\\.py .* /app/$" server/Dockerfile &&
            if [ -f server/meeting_state_store.py ]; then
              grep -Eq "^COPY .*meeting_state_store\\.py .* /app/$" server/Dockerfile &&
              python3 -m py_compile scripts/meeting-state-backup.py
            fi &&
            bash -n scripts/deploy.sh &&
            bash -n ops/meet-intelligence/meet-intelligence.sh &&
            bash -n ops/meet-intelligence/meet-intel-watch.sh &&
            bash -n ops/meet-intelligence/meet-prompts.sh &&
            bash -n ops/meet-intelligence/meet-prompt-version.sh'

      - name: Temporaeren privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/echo"
